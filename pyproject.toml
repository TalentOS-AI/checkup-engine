[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "checkup-engine"
version = "0.1.0"
description = "Open-source AI-readiness checkup for small-business websites (rubric, collectors, report renderer)."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "TalentOS", email = "talentos@agentbay.asia"}]
dependencies = []

[project.urls]
Homepage = "https://www.agentbay.asia"
Repository = "https://github.com/TalentOS-AI/checkup-engine"

[project.scripts]
checkup-engine = "checkup_engine.cli:main"

[tool.setuptools]
packages = ["checkup_engine"]

[tool.setuptools.package-data]
checkup_engine = ["prompts/*.md", "report_schema.json"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Rubric/translation tables are long bilingual string rows; wrapping them hurts readability.
ignore = ["E501"]
